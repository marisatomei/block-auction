services:
  hardhat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: block-auction-hardhat-node
    ports:
      - "8545:8545"
    volumes:
      # Mount contracts and scripts for hot reload
      - ./contracts:/app/contracts
      - ./scripts:/app/scripts
      - ./test:/app/test
      - ./hardhat.config.js:/app/hardhat.config.js
      - ./artifacts:/app/artifacts
      - ./cache:/app/cache
      # Mount src for auto-generated files (ABIs, config)
      - ./src:/app/src
      # Persist node modules
      - block-auction-node-modules:/app/node_modules
    networks:
      - block-auction-network
    environment:
      - NODE_ENV=development
    command: npx hardhat node --hostname 0.0.0.0

  # Container for running tests
  hardhat-test:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: block-auction-hardhat-test
    volumes:
      - ./contracts:/app/contracts
      - ./scripts:/app/scripts
      - ./test:/app/test
      - ./hardhat.config.js:/app/hardhat.config.js
      - block-auction-node-modules:/app/node_modules
    networks:
      - block-auction-network
    profiles:
      - test
    command: npx hardhat test

volumes:
  block-auction-node-modules:

networks:
  block-auction-network:
    driver: bridge
